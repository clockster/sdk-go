name: Specification drift

# Nightly rather than per pull request: the API deploys on its own schedule, and a change there
# would otherwise turn unrelated pull requests red.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - run: go run ./internal/cmd/syncspec -check
